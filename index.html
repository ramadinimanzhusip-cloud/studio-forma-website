<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0e10">
  <meta name="description" content="Studio Forma is an award-winning architecture and interiors practice shaping places for a more considered way of living.">
  <title>Studio Forma — Architecture & Interiors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#0E0E10', paper: '#F2F2F0', concrete: '#E5E5E2', acid: '#D8FF3E' },
          fontFamily: { sans: ['Arial', 'Helvetica Neue', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="js/projectsData.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/estimator.js" defer></script>
</head>
<body class="bg-paper text-ink antialiased">
  <div class="site-shell">
    <header class="site-header" id="site-header">
      <a class="wordmark" href="#/home" data-route="home" aria-label="Studio Forma home">
        <span class="wordmark-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>STUDIO<br>FORMA</span>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="#/works" data-route="works">Works <span>06</span></a>
        <a href="#/about" data-route="about">Studio</a>
        <a class="nav-inquire" href="#/estimate" data-route="estimate">Inquire <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main id="app-root" tabindex="-1" aria-live="polite"></main>

    <footer class="site-footer">
      <div class="footer-top">
        <div class="footer-mark">SF<span>®</span></div>
        <p>Spaces that make room<br>for what matters.</p>
        <a href="#/estimate" data-route="estimate" class="footer-inquire">Start a conversation <span>↗</span></a>
      </div>
      <div class="footer-bottom">
        <span>© Studio Forma 2025</span>
        <span>Brooklyn · Copenhagen · Everywhere</span>
        <button type="button" class="zip-button" id="download-zip"><span class="zip-dot"></span> Download Complete Codebase (.ZIP) <span class="zip-arrow">↓</span></button>
      </div>
      <p class="zip-status" id="zip-status" role="status" aria-live="polite"></p>
    </footer>
  </div>
</body>
</html>
